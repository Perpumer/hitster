<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎵 Hitster</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f1a;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
    }

    /* Animated background blobs */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }
    .blob1 { width: 400px; height: 400px; background: #7c3aed; top: -100px; left: -100px; }
    .blob2 { width: 350px; height: 350px; background: #db2777; bottom: -100px; right: -100px; }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 40px 32px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    }

    .logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 32px;
    }

    /* Vinyl disc animation */
    .vinyl-container {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 32px;
    }
    .vinyl {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle at center,
        #1a1a2e 0%, #1a1a2e 18%,
        #2a2a3e 18%, #2a2a3e 20%,
        #111 20%, #111 35%,
        #1c1c2e 35%, #1c1c2e 37%,
        #111 37%, #111 52%,
        #1c1c2e 52%, #1c1c2e 54%,
        #111 54%, #111 69%,
        #1c1c2e 69%, #1c1c2e 71%,
        #111 71%, #111 100%
      );
      box-shadow: 0 0 0 2px rgba(255,255,255,0.08), 0 8px 32px rgba(0,0,0,0.5);
      transition: animation 0.3s;
    }
    .vinyl.spinning {
      animation: spin 3s linear infinite;
    }
    .vinyl-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      box-shadow: 0 0 0 3px rgba(255,255,255,0.15);
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .song-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
      color: #fff;
    }
    .song-artist {
      font-size: 15px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 32px;
    }

    /* Progress bar */
    .progress-container {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-bottom: 12px;
      cursor: pointer;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #7c3aed, #db2777);
      border-radius: 2px;
      width: 0%;
      transition: width 0.5s linear;
    }
    .time-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 28px;
    }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 28px;
    }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      border: none;
      border-radius: 50%;
      width: 44px; height: 44px;
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.15); color: #fff; }
    .btn-play {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      border: none;
      border-radius: 50%;
      width: 68px; height: 68px;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px rgba(124,58,237,0.5);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-play:hover { transform: scale(1.06); box-shadow: 0 12px 32px rgba(124,58,237,0.6); }
    .btn-play:active { transform: scale(0.97); }

    /* Volume */
    .volume-row {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,0.35);
      font-size: 14px;
    }
    .volume-row input[type=range] {
      flex: 1;
      accent-color: #7c3aed;
      height: 4px;
      cursor: pointer;
    }

    /* Error / not found state */
    .error-state {
      text-align: center;
      padding: 20px 0;
    }
    .error-state .emoji { font-size: 48px; margin-bottom: 16px; }
    .error-state h2 { font-size: 18px; margin-bottom: 8px; }
    .error-state p { font-size: 14px; color: rgba(255,255,255,0.45); }

    /* Loading */
    .loading { color: rgba(255,255,255,0.45); font-size: 14px; padding: 20px 0; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>

  <div class="card">
    <div class="logo">🎵 Hitster Personal</div>

    <!-- Loading state -->
    <div id="loading" class="loading">Cargando canción...</div>

    <!-- Player -->
    <div id="player" class="hidden">
      <div class="vinyl-container">
        <div class="vinyl" id="vinyl"></div>
        <div class="vinyl-center"></div>
      </div>

      <div class="song-title" id="song-title">–</div>
      <div class="song-artist" id="song-artist">–</div>

      <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="time-row">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>

      <div class="controls">
        <button class="btn-secondary" id="btn-restart" title="Reiniciar">↩</button>
        <button class="btn-play" id="btn-play">▶</button>
        <button class="btn-secondary" id="btn-mute" title="Silenciar">🔊</button>
      </div>

      <div class="volume-row">
        <span>🔉</span>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="1" />
        <span>🔊</span>
      </div>
    </div>

    <!-- Error state -->
    <div id="error" class="hidden error-state">
      <div class="emoji">🎵</div>
      <h2>Canción no encontrada</h2>
      <p>Verificá que el QR sea correcto<br>o que el archivo esté subido.</p>
    </div>
  </div>

  <audio id="audio" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audio');
    const btnPlay = document.getElementById('btn-play');
    const btnRestart = document.getElementById('btn-restart');
    const btnMute = document.getElementById('btn-mute');
    const progressBar = document.getElementById('progress-bar');
    const progressContainer = document.getElementById('progress-container');
    const timeCurrent = document.getElementById('time-current');
    const timeTotal = document.getElementById('time-total');
    const volumeSlider = document.getElementById('volume');
    const vinyl = document.getElementById('vinyl');

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m}:${sec.toString().padStart(2, '0')}`;
    }

    function setPlaying(playing) {
      btnPlay.textContent = playing ? '⏸' : '▶';
      if (playing) vinyl.classList.add('spinning');
      else vinyl.classList.remove('spinning');
    }

    btnPlay.addEventListener('click', () => {
      if (audio.paused) audio.play();
      else audio.pause();
    });

    btnRestart.addEventListener('click', () => {
      audio.currentTime = 0;
      audio.play();
    });

    btnMute.addEventListener('click', () => {
      audio.muted = !audio.muted;
      btnMute.textContent = audio.muted ? '🔇' : '🔊';
    });

    audio.addEventListener('play', () => setPlaying(true));
    audio.addEventListener('pause', () => setPlaying(false));
    audio.addEventListener('ended', () => setPlaying(false));

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        const pct = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = pct + '%';
        timeCurrent.textContent = formatTime(audio.currentTime);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      timeTotal.textContent = formatTime(audio.duration);
    });

    progressContainer.addEventListener('click', (e) => {
      const rect = progressContainer.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    });

    volumeSlider.addEventListener('input', () => {
      audio.volume = volumeSlider.value;
    });

    // Load song from songs.json based on ?song= param
    async function init() {
      const params = new URLSearchParams(window.location.search);
      const songId = params.get('song');

      if (!songId) {
        showError();
        return;
      }

      try {
        const res = await fetch('songs.json');
        const songs = await res.json();
        const song = songs.find(s => String(s.id) === String(songId));

        if (!song) { showError(); return; }

        document.getElementById('song-title').textContent = song.title;
        document.getElementById('song-artist').textContent = song.artist;
        document.title = `${song.title} – Hitster`;

        audio.src = song.file;
        audio.load();

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('player').classList.remove('hidden');

        // Autoplay
        audio.play().catch(() => {
          // Autoplay blocked by browser — user taps play
        });

      } catch (e) {
        showError();
      }
    }

    function showError() {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('error').classList.remove('hidden');
    }

    init();
  </script>
</body>
</html>
